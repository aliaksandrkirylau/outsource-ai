<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audit log</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0">
<style>
body{margin:0}
a{color:#A14000}a:hover{color:#521D00}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle}
td,th{white-space:nowrap}
</style>
</helmet>
<div style="width: 100%; min-height: 1000px; box-sizing: border-box; background: #FFF8F6; color: #241914; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; display: flex; flex-direction: column">
<dc-import name="WebTopBar" user="sara" hint-size="100%,68px"></dc-import>
<div style="display: flex; flex-wrap: wrap; flex: 1; align-items: stretch">
<div style="flex: 0 0 96px; display: flex"><dc-import name="WebRail" role="admin" sel="audit" hint-size="96px,836px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; max-width: 1340px">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<h1 style="margin: 0; font-size: 24px; font-weight: 400">Audit log</h1>
<span style="color: #574238">{{count}}</span>
</div>
<div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
<label style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px 0 8px; gap: 8px; border: 1px solid #8B7267; border-radius: 20px; min-width: 300px; background: #FFFFFF"><span class="ms" aria-hidden="true" style="color: #574238">search</span><input aria-label="Search the log" placeholder="Search person, well or change" value="{{q}}" onChange="{{setQ}}" style="flex: 1; border: 0; outline: 0; font: inherit; background: transparent"></label>
<label style="display: inline-flex; align-items: center; gap: 8px; color: #574238">Type
<select value="{{type}}" onChange="{{setType}}" style="height: 40px; border: 1px solid #8B7267; border-radius: 4px; padding: 0 10px; font: inherit; color: #241914; background: #FFFFFF">
<option value="all">All</option><option value="data">Rig data</option><option value="appr">Approvals</option><option value="admin">Users, rigs, settings</option><option value="sign">Sign-in</option>
</select></label>
</div>
<div style="background: #FFFFFF; border: 1px solid #DFC0B3; border-radius: 12px; overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; min-width: 1100px">
<thead><tr style="height: 52px; text-align: left; color: #574238"><th style="padding: 0 16px; font-weight: 600">When <span class="ms" aria-hidden="true" style="font-size: 16px">arrow_downward</span></th><th style="padding: 0 12px; font-weight: 600">Who</th><th style="padding: 0 12px; font-weight: 600">Where</th><th style="padding: 0 12px; font-weight: 600">What</th><th style="padding: 0 16px; font-weight: 600">Old → new</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
<tr style="height: 48px; border-top: 1px solid #F4DED5">
<td style="padding: 0 16px; color: #574238">{{r.when}}</td><td style="padding: 0 12px">{{r.who}}</td><td style="padding: 0 12px">{{r.where}}</td>
<td style="padding: 0 12px"><span class="ms" aria-hidden="true" style="font-size: 18px; color: #574238; margin-right: 6px">{{r.icon}}</span>{{r.what}}</td><td style="padding: 0 16px; color: #574238">{{r.diff}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="color: #574238; font-size: 13px; line-height: 1.5">Read only. Rig computer entries carry the time they were made on the rig and arrive with the sync. Nothing can be edited or deleted here.</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', type: 'all' };
  }
  renderVals() {
    const IC = { data: 'science', appr: 'task_alt', admin: 'manage_accounts', sign: 'login' };
    const L = (when, who, where, type, what, diff) => ({ when, who, where, type, what, diff: diff || '-', icon: IC[type] });
    const all = [
      L('14 Oct 15:20', 'Rig computer, OES Rig 07', 'DW-217', 'data', 'Sync received: 3 mud checks, 1 report, 1 correction'),
      L('14 Oct 15:12', 'Ali Hassan', 'DW-217', 'data', 'Section report 12¼ in submitted for approval'),
      L('14 Oct 15:05', 'Rig computer, OES Rig 12', 'KH-104', 'data', 'Sync received: 2 mud checks, 1 stock movement'),
      L('14 Oct 14:20', 'Ali Hassan', 'DW-217', 'data', 'Correction requested, mud check 14:00', 'PV 41 → 34 cP'),
      L('14 Oct 14:06', 'Ali Hassan', 'DW-217', 'data', 'Reason added to flagged value, mud check 14:00', 'PV 41 cP'),
      L('14 Oct 12:10', 'Hamad Ali', 'KH-104', 'data', 'Mud check 12:00 saved, 1 flag', 'API filtrate 6.8'),
      L('14 Oct 10:02', 'Sara Al-Mutairi', 'Thresholds', 'admin', 'Override for KH-104 added', 'Density 9.0 - 12.5 → 10.5 - 12.0 ppg'),
      L('14 Oct 09:41', 'Sara Al-Mutairi', 'Users', 'admin', 'Rigs changed for Yusuf Karim', 'Rig 12 → Rig 12, Rig 21'),
      L('14 Oct 13:20', 'Faisal Qureshi', 'DW-217', 'appr', 'Correction approved, mud check 14 Oct 08:00', 'FV 52 → 50 s/qt'),
      L('14 Oct 11:15', 'Sara Al-Mutairi', 'Products', 'admin', 'Minimum on rig changed, Xanthan gum', '10 → 12 sacks'),
      L('14 Oct 09:05', 'Hamad Ali', 'KH-104', 'data', 'Correction requested, mud check 06:00', 'Chlorides 41,000 → 14,100 mg/L'),
      L('14 Oct 08:40', 'Ali Hassan', 'DW-217', 'data', 'Correction requested, mud check 08:00', 'FV 52 → 50 s/qt'),
      L('14 Oct 08:02', 'Khalid Nasser', 'HQ web', 'sign', 'Signed in'),
      L('13 Oct 21:15', 'Khalid Nasser', 'DW-217', 'appr', 'Flag marked reviewed, mud check 13 Oct 20:00', 'PV 37 cP'),
      L('13 Oct 18:12', 'Rig computer, OES Rig 21', 'KH-109', 'data', 'Sync received: 4 mud checks'),
            L('13 Oct 11:05', 'Sara Al-Mutairi', 'Products', 'admin', 'Product made inactive', 'OES-Lig'),
      L('13 Oct 07:58', 'Faisal Qureshi', 'HQ web', 'sign', 'Signed in'),
      L('12 Oct 22:47', 'Unknown', 'HQ web', 'sign', 'Failed sign-in, 3 attempts', 'faisal.qureshi@oes.example')
    ];
    const q = this.state.q.trim().toLowerCase();
    const rows = all.filter((r) => (this.state.type === 'all' || r.type === this.state.type) && (!q || (r.who + ' ' + r.where + ' ' + r.what + ' ' + r.diff).toLowerCase().includes(q)));
    return { rows, count: rows.length + ' of ' + all.length + ' entries (prototype: last 3 days)', q: this.state.q, type: this.state.type, setQ: (e) => this.setState({ q: e.target.value }), setType: (e) => this.setState({ type: e.target.value }) };
  }
}
</script>
</body>
</html>
