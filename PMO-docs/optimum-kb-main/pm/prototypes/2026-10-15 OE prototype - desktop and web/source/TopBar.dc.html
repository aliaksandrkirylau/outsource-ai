<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OE Desktop - Top bar</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0">
<style>
body{margin:0}
a{color:#A14000}a:hover{color:#521D00}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle}
</style>
</helmet>
<header style="position: relative; z-index: 20; width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; min-height: 64px; padding: 8px 16px 8px 20px; box-sizing: border-box; background: #ED712E; color: #521D00; border-bottom: 4px solid #F2A743; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #521D00">
<span style="background: #FFFFFF; color: #B83830; font-weight: 800; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 6px; font-size: 18px">OES</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600"><span class="ms" aria-hidden="true" style="font-size: 20px">precision_manufacturing</span>OES Rig 07</span>
</a>
<span style="width: 1px; height: 32px; background: #521D00; opacity: 0.35"></span>
<div style="position: relative">
<sc-if value="{{hasWell}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{toggleWells}}" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 16px; border-radius: 22px; border: 0; background: #FFFFFF; color: #241914; font: inherit; cursor: pointer">
<span class="ms" aria-hidden="true" style="color: #A14000">oil_barrel</span>
<span style="font-weight: 600">{{wellName}}</span>
<span style="color: #574238">{{wellSub}}</span>
<span class="ms" aria-hidden="true" style="color: #574238">arrow_drop_down</span>
</button>
</sc-if>
<sc-if value="{{noWell}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 22px; background: #FFF1EC; color: #574238"><span class="ms" aria-hidden="true">oil_barrel</span>No well yet</span>
</sc-if>
<sc-if value="{{wellsOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; top: 52px; left: 0; width: 400px; background: #FFF1EC; color: #241914; border-radius: 8px; box-shadow: 0 4px 12px rgba(36,25,20,0.22); padding: 8px 0; display: flex; flex-direction: column">
<div style="padding: 8px 16px; font-size: 12px; font-weight: 600; color: #574238">WELLS ON THIS RIG</div>
<sc-for list="{{wells}}" as="w" hint-placeholder-count="3">
<div style="display: flex; align-items: center; background: {{w.bg}}">
<a href="Dashboard.dc.html" role="menuitem" style="flex: 1; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px 0 16px; color: #241914; text-decoration: none">
<span class="ms" aria-hidden="true" style="color: #A14000; width: 22px">{{w.mark}}</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{w.name}}</span><span style="font-size: 12px; color: #574238">{{w.sub}}</span></span>
<span style="font-size: 12px; font-weight: 600; color: {{w.statusColor}}">{{w.status}}</span>
</a>
<a href="WellForm.dc.html" aria-label="View or edit {{w.name}}" style="display: inline-flex; width: 44px; height: 44px; margin-right: 8px; align-items: center; justify-content: center; color: #574238; text-decoration: none"><span class="ms" aria-hidden="true" style="font-size: 20px">edit</span></a>
</div>
</sc-for>
<div style="height: 1px; background: #DFC0B3; margin: 8px 0"></div>
<a href="WellNew.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; color: #241914; text-decoration: none"><span class="ms" aria-hidden="true" style="color: #574238">add</span>New well</a>
</div>
</sc-if>
</div>
<div style="flex: 1"></div>
<button type="button" onClick="{{toggleSync}}" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: #FFFFFF; color: #00658B; font: inherit; font-weight: 600; cursor: pointer">
<sc-if value="{{offline}}" hint-placeholder-val="{{ true }}"><span class="ms" aria-hidden="true" style="font-size: 18px">cloud_off</span>Offline · 3 changes to sync</sc-if>
<sc-if value="{{online}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 18px">cloud_done</span>Synced 14:12</sc-if>
</button>
<div style="position: relative">
<button type="button" onClick="{{toggleUser}}" aria-haspopup="menu" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px; border: 0; border-radius: 24px; background: transparent; font: inherit; color: #521D00; cursor: pointer">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #FFF1EC; color: #521D00; display: flex; align-items: center; justify-content: center; font-weight: 700">AH</span>
<span style="display: flex; flex-direction: column; line-height: 1.2; text-align: left"><span style="font-weight: 600">Ali Hassan</span><span style="font-size: 12px">Mud engineer</span></span>
<span class="ms" aria-hidden="true">arrow_drop_down</span>
</button>
<sc-if value="{{userOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; top: 52px; right: 0; width: 220px; background: #FFF1EC; border-radius: 8px; box-shadow: 0 4px 12px rgba(36,25,20,0.22); padding: 8px 0; display: flex; flex-direction: column">
<a href="Settings.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; color: #241914; text-decoration: none"><span class="ms" aria-hidden="true" style="color: #574238">settings</span>Settings</a>
<a href="SignIn.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; color: #241914; text-decoration: none"><span class="ms" aria-hidden="true" style="color: #574238">logout</span>Sign out</a>
</div>
</sc-if>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wellName":{"editor":"text","default":"DW-217"},"wellSub":{"editor":"text","default":"12¼ in section · Day shift"},"noWell":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":68}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { offline: true, wellsOpen: false, userOpen: false };
  }
  renderVals() {
    const s = this.state;
    const noWell = this.props.noWell === true || this.props.noWell === 'true';
    const wellName = this.props.wellName ?? 'DW-217';
    const defs = [
      { name: 'DW-217', sub: '12¼ in section · Day shift', status: 'In progress', statusColor: '#A14000' },
      { name: 'DW-212', sub: 'Completed 28 Aug 2026', status: 'Completed', statusColor: '#574238' },
      { name: 'DW-209', sub: 'Completed 19 Jul 2026', status: 'Completed', statusColor: '#574238' }
    ];
    const wells = defs.map((w) => ({ ...w, mark: w.name === wellName ? 'check' : '', bg: w.name === wellName ? '#F6CD96' : 'transparent' }));
    return {
      wells,
      wellName,
      wellSub: this.props.wellSub ?? '12¼ in section · Day shift',
      hasWell: !noWell,
      noWell,
      wellsOpen: s.wellsOpen,
      userOpen: s.userOpen,
      offline: s.offline,
      online: !s.offline,
      toggleSync: () => this.setState({ offline: !s.offline }),
      toggleWells: () => this.setState({ wellsOpen: !s.wellsOpen, userOpen: false }),
      toggleUser: () => this.setState({ userOpen: !s.userOpen, wellsOpen: false })
    };
  }
}
</script>
</body>
</html>
